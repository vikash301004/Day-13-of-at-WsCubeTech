<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        .parent {
            width: 400px;
            height: 400px;
            border: 1px red solid;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
        }

        .box {
            height: 80%;
            width: 80%;
            border: 2px black solid;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .parent>.box{
            border-radius: 40px;
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="box">
            <div class="box">
                <div class="box"></div>
            </div>
        </div>
    </div>
</body>

</html>
