<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        h1{
            font-style: italic;
        }
     .box1 h1{
        color: red;
     }
     .parent{
        height: 350px;
        width: 350px;
        border: 1px solid black;
        margin: auto;
        display: flex;
        align-items: center;
        justify-content: center;
     }
     .box{
        height: 100px;
        width: 100px;
        background-color: red;
     }
     .parent:hover .box{
        background-color: goldenrod;
     }
    </style>
</head>
<body>
    <div class="parent">
        <div class="box"></div>
    </div>
    <div class="box1">
        <h1>hello</h1>
    </div>
    <div class="box2">
        <h1>hii</h1>
    </div>
</body>
</html>
